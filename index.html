    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      (function() {
        try {
          var manualTheme = localStorage.getItem('wesd-color-theme');
          var activeBusiness = localStorage.getItem('glowup_active_business');
          
          if (manualTheme) {
            document.documentElement.setAttribute('data-theme', manualTheme);
          } else if (activeBusiness) {
            document.documentElement.setAttribute('data-theme', activeBusiness.replace(/"/g, ''));
          } else {
            document.documentElement.setAttribute('data-theme', 'minuit');
          }
        } catch (e) {}
      })();
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
